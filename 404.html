<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0c0b0a">
  <title>Página no encontrada — Musa</title>
  <meta name="description" content="Esta dirección no existe en la web de Musa.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="https://ardu01.github.io/musa-web/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #0c0b0a;
      color: #f6f1e7;
      font-family: "Segoe UI", "Liberation Sans", "Noto Sans", sans-serif;
      line-height: 1.5;
    }
    a { color: #f0c27a; }
    .skip {
      position: absolute;
      left: 1rem;
      top: 0.6rem;
      transform: translateY(-160%);
      background: #e6a23c;
      color: #1a140c;
      font-weight: 700;
      text-decoration: none;
      padding: 0.7rem 1rem;
      border-radius: 999px;
    }
    .skip:focus { transform: none; }
    main { flex: 1; width: min(40rem, calc(100% - 2.5rem)); margin: 0 auto; padding: 6rem 0 3rem; }
    h1 {
      font-family: Palatino, "Palatino Linotype", "Noto Serif", Georgia, serif;
      font-size: clamp(2.6rem, 8vw, 4.5rem);
      font-weight: 500;
      letter-spacing: -0.04em;
      line-height: 1;
      margin: 0;
    }
    p { color: #cfc6b6; }
    .btn {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      padding: 0 1.15rem;
      border-radius: 999px;
      background: #e6a23c;
      color: #1a140c;
      text-decoration: none;
      font-weight: 700;
    }
    footer { border-top: 1px solid rgba(246, 241, 231, 0.14); color: #cfc6b6; padding: 1.5rem; }
    :focus-visible { outline: 3px solid #f0c27a; outline-offset: 3px; }
  </style>
</head>
<body>
  <a class="skip" href="#contenido">Saltar al contenido</a>
  <main id="contenido">
    <p>Musa</p>
    <h1>Página no encontrada</h1>
    <p>Esta dirección no existe en la web de Musa.</p>
    <p><a class="btn" href="https://ardu01.github.io/musa-web/">Volver al inicio</a></p>
  </main>
  <footer>Un proyecto de Miguel.</footer>
</body>
</html>
